[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiiscale"
version = "0.1.0"
description = "Bridge a Wii Balance Board to Home Assistant over MQTT"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
wiiscale = "wiiscale.cli:main"

[tool.setuptools.packages.find]
include = ["wiiscale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
